name: Build desktop installers
on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        default: all
        type: choice
        options: [all, windows, mac-arm, mac-intel]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/test_hub_api.py tests/test_hub_remote.py tests/test_hub_ingest.py tests/test_hub_migration.py tests/test_hub_sources.py tests/test_body_limits.py tests/test_hub_updates.py tests/test_hub_documents.py -q
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci && npm test && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: frontend
  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: windows
            os: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - key: mac-arm
            os: macos-14
            target: aarch64-apple-darwin
            bundles: dmg
          - key: mac-intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == matrix.key
      - uses: actions/setup-python@v5
        if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == matrix.key
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == matrix.key
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - name: Rust toolchain
        if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == matrix.key
        shell: bash
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/cache/restore@v4
        id: cargo-cache
        if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == matrix.key
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/target
          key: rust-${{ matrix.target }}-${{ hashFiles('desktop/Cargo.lock') }}
          restore-keys: rust-${{ matrix.target }}-
      - name: Dependencies and web assets
        if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == matrix.key
        shell: bash
        run: |
          pip install -r requirements-build.txt
          npm ci
          npm --prefix frontend ci
          npm --prefix frontend run build
      - name: Freeze target-native Python core
        if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == matrix.key
        run: python scripts/build_sidecar.py --target ${{ matrix.target }}
      - name: Smoke test frozen parser
        if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == matrix.key
        run: python scripts/smoke_sidecar.py --target ${{ matrix.target }}
      - name: Build installer
        if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == matrix.key
        working-directory: desktop
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: '13.0'
        run: |
          python ../scripts/prepare_installer_output.py --target ${{ matrix.target }}
          ../node_modules/.bin/tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Smoke test packaged desktop
        if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == matrix.key
        run: python scripts/smoke_desktop.py --target ${{ matrix.target }}
      - uses: actions/cache/save@v4
        if: always() && (github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == matrix.key) && steps.cargo-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/target
          key: rust-${{ matrix.target }}-${{ hashFiles('desktop/Cargo.lock') }}
      - uses: actions/upload-artifact@v4
        if: failure() && (github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == matrix.key)
        with:
          name: smoke-debug-${{ matrix.key }}
          path: .runtime/smoke-*.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: (github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == matrix.key) && success()
        with:
          name: cursor-session-hub-${{ matrix.key }}
          path: |
            desktop/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            desktop/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            .runtime/smoke-*.json
            LICENSE
            NOTICE.md
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  release:
    if: github.event_name == 'push'
    needs: [test, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches application version
        run: |
          test "$GITHUB_REF_NAME" = "v$(python -c 'import json; print(json.load(open("desktop/tauri.conf.json"))["version"])')"
      - uses: actions/download-artifact@v4
        with:
          pattern: cursor-session-hub-*
          path: release-input
      - run: python scripts/prepare_release.py release-input
      - name: Create release draft with tested installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="docs/releases/$GITHUB_REF_NAME.md"
          if [ ! -f "$NOTES" ]; then
            NOTES="$RUNNER_TEMP/release-notes.md"
            printf 'Cursor Session Hub %s — Windows x64, Mac Apple Silicon, Mac Intel.\n' "$GITHUB_REF_NAME" > "$NOTES"
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "Cursor Session Hub $GITHUB_REF_NAME" --notes-file "$NOTES" release-assets/*
